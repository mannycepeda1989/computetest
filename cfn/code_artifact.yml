AWSTemplateFormatVersion: 2010-09-09
Description: "Template for CodeArtifact repositories. Creates Domain if CreateDomainFlag is True"
Parameters:
  DomainName:
    Type: String
    Description: The name of the CodeArtifact Domain
    Default: crypto-tools-internal
  RepositoryName:
    Type: String
    Description: Base Name for the Repositories
    Default: esdk-java
  CreateDomainFlag:
    Type: String
    Description: Attempt to create Domain or not
    Default: False
    AllowedValues:
      - True
      - False

Conditions:
  CreateDomain: !Equals
    - !Ref CreateDomainFlag
    - True

Resources:
  Domain:
    Type: AWS::CodeArtifact::Domain
    Condition: CreateDomain
    Properties:
      DomainName: !Ref DomainName
      Tags:
        - Key: yor_trace
          Value: ef188da2-0091-4697-b04f-1ec4bceb6cf2
        - Key: manny
          Value: cepeda
        - Key: git_org
          Value: mannycepeda1989
  CIRepo:
    Type: AWS::CodeArtifact::Repository
    Properties:
      DomainName: !Ref DomainName
      RepositoryName: !Sub "${RepositoryName}-ci"
      Tags:
        - Key: yor_trace
          Value: cb4e29d1-1946-46ba-af0e-58ae058895d8
        - Key: manny
          Value: cepeda
        - Key: git_org
          Value: mannycepeda1989
  StagingRepo:
    Type: AWS::CodeArtifact::Repository
    Properties:
      DomainName: !Ref DomainName
      RepositoryName: !Sub "${RepositoryName}-staging"
      Tags:
        - Key: manny
          Value: cepeda
        - Key: git_org
          Value: mannycepeda1989
        - Key: yor_trace
          Value: 92934d2d-38a1-4baa-8921-9f1bc93ca0f6
